/* Prova de impressão: grid suíço aparente, rampa de 12 cinzas frios, Archivo + IBM Plex Mono */
:root{
  --g-50:#F6F8FA;--g-100:#EEEFF1;--g-150:#E3E5E8;--g-200:#D7D9DC;--g-300:#C0C3C5;--g-400:#A7A9AC;
  --g-500:#8C8E90;--g-600:#717376;--g-700:#585A5C;--g-800:#3F4143;--g-900:#292A2C;--g-950:#161719;

/* Cabeçalho */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.head .frame{height:56px;display:flex;align-items:center;gap:16px}
.head .blk{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.head .sp{flex:1}
.head .save{color:var(--ink-3);white-space:nowrap}
.head .cnt{white-space:nowrap}.head .cnt span{color:var(--ink-3)}
.head .vr{width:1px;height:16px;background:var(--rule);flex:none}
.hbtn{min-height:44px;display:inline-flex;align-items:center;color:var(--ink-2)}
.hbtn:hover{color:var(--ink)}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:1px}
.prog .fill{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--ink);transform-origin:left;transition:transform 400ms var(--ease-io)}
.prog .tick{position:absolute;bottom:0;width:1px;height:5px;background:var(--line-strong)}
@media (max-width:720px){.head .save,.head .hide-m{display:none}.head .frame{gap:10px}}

/* Tema */
.theme{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--ink-3)}
.theme .w{padding:14px 0}
.theme .on{color:var(--ink);text-decoration:underline 1px;text-underline-offset:4px}
.theme .sl{color:var(--ink-3)}
.theme sup{font-size:9px;margin-left:2px;color:var(--ink-3)}
.theme svg{display:none}
.theme:hover .w:not(.on){color:var(--ink-2)}
.theme .half{transform-origin:8px 8px;transition:transform 240ms var(--ease-io)}
:root[data-theme="dark"] .theme .half{transform:rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .half{transform:rotate(180deg)}}
@media (max-width:720px){.theme .w,.theme .sl{display:none}.theme svg{display:block}.theme{width:44px;justify-content:center;color:var(--ink-2)}}
:root.theme-anim,:root.theme-anim *,:root.theme-anim *::before,:root.theme-anim *::after{transition:background-color 240ms ease,color 240ms ease,border-color 240ms ease,fill 240ms ease,stroke 240ms ease!important}

:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Botões */
.btn{font:600 var(--t-button)/1 var(--f-sans);font-variation-settings:"wdth" 104;letter-spacing:.01em;height:52px;padding:0 22px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
.btn-p{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.btn-p:hover{background:color-mix(in oklch,var(--ink) 85%,var(--paper))}
.btn-p .ar{transition:transform 180ms var(--ease-out)}.btn-p:hover .ar{transform:translateX(4px)}
.btn-p:disabled{background:transparent;color:var(--ink-3);border:1px dashed var(--line-strong);cursor:default}
.btn-s{background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
.btn-s:hover{border-color:var(--ink);background:var(--tint)}
.btn-t{min-height:44px;color:var(--ink-2);text-decoration:underline 1px;text-underline-offset:5px;display:inline-flex;align-items:center}
.btn-t:hover{color:var(--ink)}

/* Rodapé fixo */
.foot{position:fixed;inset:auto 0 0 0;z-index:20;background:color-mix(in oklch,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--rule);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.foot .frame{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot .r{display:flex;align-items:center;gap:16px;min-width:0}
.foot .kbd{color:var(--ink-3)}
@media (hover:none) and (pointer:coarse){.foot .kbd{display:none}}
.cover-foot .kbd{color:var(--cover-sub)}
.foot .back-m{display:none}
@media (max-width:720px){.foot .kbd,.foot .back-d{display:none}.foot .back-m{display:inline-flex;width:52px;padding:0}.foot .r{flex:1}.foot .r .btn-p{flex:1}}
.pad-foot{padding-bottom:calc(var(--foot-h) + 48px + env(safe-area-inset-bottom,0px))}

/* Abertura */
.intro{min-height:calc(100vh - 57px);padding-block:clamp(40px,10vh,120px) 48px;display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--gutter);align-content:start;position:relative}
.intro .txt{grid-column:1 / span 7;position:relative;z-index:2;display:flex;flex-direction:column;gap:28px}
.intro .eyebrow{color:var(--ink-2)}
.intro h1{font-size:var(--t-hero);font-weight:600;font-variation-settings:"wdth" 108;line-height:.95;letter-spacing:-.035em;text-wrap:balance}
.intro .lead{font-size:var(--t-hint);color:var(--ink-2);max-width:56ch;text-wrap:pretty}
.spec{width:min(100%,520px);border-top:1px solid var(--rule)}
.spec>div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.spec dt{color:var(--ink-2)}.spec dd{margin:0;color:var(--ink);font-size:.95rem}
.spec dd b{font-family:var(--f-mono);font-weight:500;font-size:.75rem;letter-spacing:.06em;margin-right:8px}
.intro .acts{display:flex;flex-wrap:wrap;align-items:center;gap:20px}
.intro .note{font-size:.875rem;color:var(--ink-2);max-width:56ch}
.construct{grid-column:7 / span 6;grid-row:1;align-self:start;position:relative;aspect-ratio:1;width:100%;max-width:600px;justify-self:end;color:var(--ink)}
.construct svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.construct .logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);--logo-w:clamp(160px,22vw,300px);animation:fadein 400ms 1500ms var(--ease-out) both}
.construct .ring{stroke-dasharray:1900;stroke-dashoffset:1900;animation:draw 1200ms var(--ease-io) forwards}
.construct .diag{stroke-dasharray:850;stroke-dashoffset:850;animation:draw 500ms 1100ms var(--ease-io) forwards}
.sig{position:absolute;right:0;bottom:16px;color:var(--ink-3)}
@media (max-width:720px){
  .intro{padding-top:24px}
  .construct{grid-column:1 / -1;grid-row:1;justify-self:center;max-width:none;aspect-ratio:2/1;overflow:hidden;margin-bottom:24px}
  .construct svg{height:200%}
  .construct .logo{top:62%;--logo-w:44vw}
  .intro .txt{grid-column:1 / -1;grid-row:2}
  .sig{position:static;margin-top:32px;grid-column:1/-1}
}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Pergunta */
.q{display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--gutter);padding-top:clamp(40px,10vh,112px)}
.q .side{grid-column:1 / span 2;display:flex;flex-direction:column;gap:6px;padding-top:.6em}
.q .side .ix{color:var(--ink-2)}.q .side .kind{color:var(--ink-3)}
.q .main{grid-column:3 / span 8;min-width:0}
.q h2{font-size:var(--t-question);font-weight:560;font-variation-settings:"wdth" 104;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;max-width:24ch}
.q h2:focus{outline:none}
.q .hint{margin-top:16px;font-size:var(--t-hint);color:var(--ink-2);max-width:56ch;text-wrap:pretty}
.q .rule{height:1px;background:var(--rule);margin:36px 0 32px}
.part+.part{margin-top:40px}
.plabel{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;color:var(--ink-2)}
.plabel .lim{color:var(--ink-3)}
.msg{min-height:20px;margin-top:10px;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.02em;color:var(--ink-2)}
.clear{margin-top:20px}
@media (max-width:720px){
  .q{padding-top:28px}
  .q .side{grid-column:1/-1;flex-direction:row;gap:12px;padding:0 0 12px}
  .q .main{grid-column:1/-1}
}
.enter{animation:qin 320ms var(--ease-out) both}
.enter-back{animation:qinb 320ms var(--ease-out) both}
@keyframes qin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes qinb{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* Texto */
.field{width:100%;resize:none;border:0;border-radius:0;background:repeating-linear-gradient(to bottom,transparent 0 calc(1.45em - 1px),var(--rule) calc(1.45em - 1px) 1.45em);
  line-height:1.45em;font-size:var(--t-input);padding:0;border-bottom:1px solid var(--line-strong);caret-color:var(--ink);color:var(--ink);display:block;overflow:hidden}
.field::placeholder{color:var(--ink-3)}
.field:focus{outline:none;border-bottom:2px solid var(--ink)}
input.field{height:1.45em;background:none}
.fmeta{display:flex;justify-content:flex-end;margin-top:8px;color:var(--ink-3);min-height:16px}
.prefix{font-size:var(--t-input);color:var(--ink-2);margin-bottom:6px}
.money{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line-strong);max-width:520px}
.money:focus-within{border-bottom:2px solid var(--ink)}
.money .cur{color:var(--ink-2);font-family:var(--f-mono);font-size:.875rem}
.money input{border:0;background:none;outline:none;font-size:var(--t-question);font-weight:500;font-variant-numeric:tabular-nums;width:100%;min-width:0;padding:4px 0;color:var(--ink)}
.money input::placeholder{color:var(--ink-3)}
.money .suf{color:var(--ink-3);white-space:nowrap}

/* Base de controle */
.ctl{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:0;text-align:left;transition:background-color 140ms,color 140ms,border-color 140ms}
.ctl:hover{border-color:var(--line-strong);background:var(--tint)}
.ctl[aria-checked="true"],.ctl[aria-pressed="true"]{background:var(--select);color:var(--on-select);border-color:var(--select);position:relative;z-index:1}
.ctl[aria-checked="true"]:hover,.ctl[aria-pressed="true"]:hover{background:var(--select-hover);border-color:var(--select-hover)}
.ctl.dim{color:var(--ink-3);border-style:dashed;background:transparent}
.ctl:disabled{color:var(--ink-3);border-style:dashed;background:transparent;cursor:not-allowed}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.cards .card{margin:0 -1px -1px 0;min-height:96px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;position:relative}
.cards.list{grid-template-columns:minmax(0,1fr)}
.cards.list .card{min-height:60px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;padding:14px 18px}
.card .ix{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.card[aria-checked="true"] .ix,.card[aria-pressed="true"] .ix{color:var(--on-select)}
.card .tx{font-size:var(--t-option);font-weight:500;line-height:1.3}
.card .sub{display:block;font-size:.875rem;font-weight:400;color:var(--ink-2);margin-top:4px}
.card[aria-checked="true"] .sub{color:var(--on-select)}
.card .box{position:absolute;top:18px;right:18px;width:10px;height:10px;border:1px solid currentColor}
.card[aria-checked="true"] .box{background:currentColor}
.cards.list .card .box{position:static;margin-left:auto;flex:none}
@media (max-width:720px){.cards{grid-template-columns:minmax(0,1fr)}.cards .card{min-height:72px}}
.outro-in{margin-top:16px}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:10px;font-size:var(--t-option);font-weight:500;background:transparent}
.chip .pf{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3);min-width:.7em}
.chip[aria-checked="true"] .pf{color:var(--on-select)}
.chip.outro{border-style:dashed}
.chip .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em}

/* Ordenação */
.rank h4{margin:0 0 10px;color:var(--ink-3);font-weight:500}
.rank .grp+.grp{margin-top:24px}
.rrow{display:flex;align-items:stretch;margin-bottom:-1px}
.rrow .rb{flex:1;min-height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:var(--t-option);font-weight:500}
.rrow .sq{width:32px;height:32px;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:14px;font-weight:500;flex:none}
.rrow.on .rb{border-color:var(--line-strong)}
.rrow.on .sq{background:var(--select);color:var(--on-select);border-color:var(--select);animation:pop 160ms var(--ease-out)}
.rrow .mv{width:48px;margin-left:-1px;font-family:var(--f-mono);color:var(--ink-2)}
.rrow .mv:disabled{color:var(--line);cursor:default}
.rank .tools{display:flex;justify-content:flex-end;margin-top:12px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* Escalas */
.axis+.axis{margin-top:40px}
.axis .poles{display:flex;justify-content:space-between;gap:16px;font-size:var(--t-option);font-weight:500;margin-bottom:6px}
.axis .poles .ai{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3);margin-right:8px}
.axis .track{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:44px}
.axis .track::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--line-strong)}
.axis .pt{position:relative;display:flex;align-items:center;justify-content:center;height:44px}
.axis .pt::before{content:"";width:1px;height:12px;background:var(--line-strong)}
.axis .pt::after{content:"";position:absolute;width:14px;height:14px;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid transparent}
.axis .pt:hover::after{border-color:var(--line-strong)}
.axis .pt[aria-checked="true"]::after{background:var(--ink);border-color:var(--ink)}
.axis .nums{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.axis .nums .on{color:var(--ink)}
.axis .read{margin-top:6px;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);min-height:18px}

/* Idade */
.age .read{font-size:var(--t-question);font-weight:560;font-variation-settings:"wdth" 104;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.age .read .u{font-family:var(--f-mono);font-size:.75rem;font-weight:500;letter-spacing:.08em;color:var(--ink-2);margin-left:10px}
.age.untouched .read{color:var(--ink-3)}
.age .sl{display:grid;grid-template-columns:130px 1fr 44px 44px;align-items:center;gap:8px;margin-top:14px}
.age .sl label{color:var(--ink-2)}
.age input[type=range]{width:100%;accent-color:var(--ink);height:44px;margin:0}
.age .pm{height:44px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono)}
.age .pm:hover{border-color:var(--line-strong)}
@media (max-width:720px){.age .sl{grid-template-columns:1fr 44px 44px}.age .sl label{grid-column:1/-1}}

/* Matriz */
.mx .row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;border-top:1px solid var(--rule);padding:8px 0}
.mx .row:last-child{border-bottom:1px solid var(--rule)}
.mx .rl{display:flex;gap:12px;align-items:baseline;font-size:var(--t-option);font-weight:500}
.mx .rl .ri{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.mx .row.done .ri{color:var(--ink)}
.seg{display:flex;flex:none}
.seg .ctl{min-height:44px;min-width:88px;padding:0 14px;margin-left:-1px;font-family:var(--f-mono);font-size:var(--t-label);font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-align:center;background:transparent}
.mx .top{display:flex;justify-content:flex-end;margin-bottom:10px;color:var(--ink-3)}
@media (max-width:720px){.mx .row{flex-direction:column;align-items:stretch;padding:14px 0}.seg{width:100%}.seg .ctl{flex:1;min-width:0}}

/* Este ou aquele */
.duel+.duel{margin-top:36px}
.duel .dh{display:flex;justify-content:flex-end;margin-bottom:8px;color:var(--ink-3)}
.duel .pair{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:stretch}
.duel .or{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--f-mono)}
.duel .opt{min-height:180px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.duel .opt .ab{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.duel .opt[aria-checked="true"] .ab{color:var(--on-select)}
.duel .opt .tx{font-size:var(--t-choice-lg);font-weight:560;font-variation-settings:"wdth" 104;line-height:1.15;letter-spacing:-.015em}
.duel.quote .opt{min-height:240px}
.duel.quote .opt .tx{font-size:var(--t-input);font-weight:400;font-variation-settings:"wdth" 100;letter-spacing:0;line-height:1.45}
.duel.quote .opt .qm{font-size:3rem;line-height:.6;color:var(--ink-3);font-weight:600}
.duel.quote .opt[aria-checked="true"] .qm{color:var(--on-select)}
.duel.compact .opt{min-height:112px}
.excl{margin-bottom:28px}
.excl-note{margin-top:12px;font-size:.875rem;color:var(--ink-2)}
@media (max-width:720px){.duel .pair{grid-template-columns:minmax(0,1fr)}.duel .or{height:36px;position:relative}.duel .or::before,.duel .or::after{content:"";flex:1;height:1px;background:var(--rule);margin:0 12px}.duel .opt,.duel.quote .opt{min-height:120px}.duel.compact .opt{min-height:84px}}

/* Paletas */
.pal{padding:16px;margin:0 -1px -1px 0;display:flex;flex-direction:column;gap:12px}
.pal .sw{display:flex;height:88px}
.pal .sw span{display:block}
.pal .hx{display:flex;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.04em}
.pal .hx span{overflow:hidden;text-overflow:clip;white-space:nowrap}
.pal .nm{font-size:var(--t-option);font-weight:500;padding:8px 10px;margin:-4px -10px -10px;display:flex;justify-content:space-between}
.pal[aria-checked="true"]{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.pal[aria-checked="true"] .nm{background:var(--select);color:var(--on-select)}
.pal[aria-checked="true"] .hx{color:var(--ink-3)}

/* Geradas */
.gen-intro{border:1px dashed var(--line);padding:24px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.gen-intro p{color:var(--ink-2);max-width:56ch}
.gen-load .lbl{color:var(--ink-2);margin-bottom:12px}
.gen-load .lbl i{font-style:normal;animation:blink 1.2s steps(1) infinite}
.gen-load .boxes{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.gen-load .boxes span{height:60px;border:1px dashed var(--line);margin:0 -1px -1px 0}
.gen-load .boxes::after{content:"";position:absolute;top:0;bottom:0;width:80px;left:-80px;background:var(--tint);opacity:.7;border-right:1px solid var(--ink);mix-blend-mode:multiply;animation:sweep 1.6s var(--ease-io) infinite}
:root[data-theme="dark"] .gen-load .boxes::after{mix-blend-mode:screen}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gen-load .boxes::after{mix-blend-mode:screen}}
.gen-load .acts{margin-top:14px}
.gen-src{margin-top:12px;color:var(--ink-3)}
.gen-tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.stagger>*{animation:qin 280ms var(--ease-out) both}
@keyframes sweep{to{left:100%}}
@keyframes blink{50%{opacity:.3}}
@media (max-width:720px){.gen-load .boxes{grid-template-columns:1fr}}

/* Capa */
.cover{min-height:100vh;position:relative;overflow:hidden;background:var(--cover-bg);color:var(--cover-fg);animation:sheet 560ms var(--ease-io) both}
.cover .frame{min-height:100vh;display:flex;flex-direction:column;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--foot-h) + 24px)}
.cover .top{display:flex;align-items:center;gap:16px;color:var(--cover-sub)}
.cover .top .ln{flex:1;height:1px;background:currentColor;opacity:.6;transform-origin:left;animation:line 480ms 200ms var(--ease-io) both}
.cover .theme{color:var(--cover-sub)}.cover .theme .on{color:var(--cover-fg)}.cover .theme .sl,.cover .theme sup{color:var(--cover-sub)}
.cover .body{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);column-gap:var(--gutter);align-items:end;margin-top:24px}
.cover .num{grid-column:1 / span 5;font-size:var(--t-chapter);font-weight:300;font-variation-settings:"wdth" 112;line-height:.8;letter-spacing:-.06em;color:var(--cover-num,var(--cover-fg));margin-bottom:-.08em;animation:numin 640ms 280ms var(--ease-out) both;font-variant-numeric:tabular-nums}
.cover .ttl{grid-column:6 / span 6;display:flex;flex-direction:column;gap:16px;padding-bottom:12px;animation:qin 320ms 440ms var(--ease-out) both}
.cover h2{font-size:var(--t-chapter-title);font-weight:600;font-variation-settings:"wdth" 104;line-height:1;letter-spacing:-.025em;text-wrap:balance}
.cover h2:focus{outline:none}
.cover p{font-size:var(--t-hint);color:var(--cover-sub);max-width:44ch;text-wrap:pretty}
.cover .reg{position:absolute;color:var(--cover-sub)}
.cover-foot{background:var(--cover-bg)!important;border-top-color:color-mix(in oklch,var(--cover-fg) 18%,var(--cover-bg))!important}
.cover-foot .btn-p{background:var(--cover-fg);color:var(--cover-bg);border-color:var(--cover-fg)}
.cover-foot .btn-t{color:var(--cover-sub)}.cover-foot .btn-t:hover{color:var(--cover-fg)}
@keyframes sheet{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@keyframes line{from{transform:scaleX(0)}to{transform:none}}
@keyframes numin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (max-width:720px){.cover .body{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:16px}.cover .num{font-size:9rem}.cover .top{flex-wrap:wrap}.cover .top .ln{display:none}}
.cv[data-b="1"]{--cover-bg:var(--g-150);--cover-fg:var(--g-950);--cover-sub:var(--g-700)}

.cv[data-b="5"]{--cover-bg:var(--g-500);--cover-fg:var(--g-950);--cover-sub:var(--g-950)}
.cv[data-b="6"]{--cover-bg:var(--g-600);--cover-fg:var(--g-50);--cover-sub:var(--g-50)}
.cv[data-b="7"]{--cover-bg:var(--g-700);--cover-fg:var(--g-50);--cover-sub:var(--g-200)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cv{--cover-bg:var(--g-900);--cover-fg:var(--g-100);--cover-sub:var(--g-400)}}
:root[data-theme="dark"] .cv{--cover-bg:var(--g-900);--cover-fg:var(--g-100);--cover-sub:var(--g-400)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]) .cv[data-b="1"]{--cover-num:var(--g-700)}:root:not([data-theme="light"]) .cv[data-b="2"]{--cover-num:var(--g-600)}
:root:not([data-theme="light"]) .cv[data-b="3"]{--cover-num:var(--g-500)}:root:not([data-theme="light"]) .cv[data-b="4"]{--cover-num:var(--g-400)}
:root:not([data-theme="light"]) .cv[data-b="5"]{--cover-num:var(--g-300)}:root:not([data-theme="light"]) .cv[data-b="6"]{--cover-num:var(--g-200)}
:root:not([data-theme="light"]) .cv[data-b="7"]{--cover-num:var(--g-150)}:root:not([data-theme="light"]) .cv[data-b="8"]{--cover-num:var(--g-100)}
:root:not([data-theme="light"]) .cv[data-b="9"]{--cover-num:var(--g-50)}}
:root[data-theme="dark"] .cv[data-b="1"]{--cover-num:var(--g-700)}:root[data-theme="dark"] .cv[data-b="2"]{--cover-num:var(--g-600)}
:root[data-theme="dark"] .cv[data-b="3"]{--cover-num:var(--g-500)}:root[data-theme="dark"] .cv[data-b="4"]{--cover-num:var(--g-400)}
:root[data-theme="dark"] .cv[data-b="5"]{--cover-num:var(--g-300)}:root[data-theme="dark"] .cv[data-b="6"]{--cover-num:var(--g-200)}
:root[data-theme="dark"] .cv[data-b="7"]{--cover-num:var(--g-150)}:root[data-theme="dark"] .cv[data-b="8"]{--cover-num:var(--g-100)}
:root[data-theme="dark"] .cv[data-b="9"]{--cover-num:var(--g-50)}

.reg{position:absolute;width:11px;height:11px;color:var(--line-strong);pointer-events:none}
@media (max-width:720px){.reg{display:none}}

/* Telas de lista: revisão, painel */
.page{padding-top:clamp(40px,8vh,96px)}
.page .eyebrow{color:var(--ink-2);margin-bottom:16px}
.page h1{font-size:var(--t-question);font-weight:560;font-variation-settings:"wdth" 104;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;max-width:26ch}
.page h1:focus{outline:none}
.page .lead{margin-top:16px;font-size:var(--t-hint);color:var(--ink-2);max-width:60ch}
.notice{margin-top:24px;border:1px solid var(--line);padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;font-size:.95rem;color:var(--ink-2)}
.rv-block{margin-top:44px}
.rv-block h3{display:flex;gap:14px;align-items:baseline;font-size:1.25rem;font-weight:600;font-variation-settings:"wdth" 104;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.rv-block h3 .mono{color:var(--ink-3)}
.rv-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:start}

function themeStored(){try{return localStorage.getItem(TH_KEY)}catch(e){return null}}

 return `<span class="w ${d?"":"on"}">Claro${!d&&auto?"<sup>auto</sup>":""}</span><span class="sl">/</span><span class="w ${d?"on":""}">Escuro${d&&auto?"<sup>auto</sup>":""}</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="none" stroke="currentColor"/><path class="half" d="M2.7 13.3 A7.5 7.5 0 0 1 13.3 2.7 Z" fill="currentColor"/><line x1="1" y1="15" x2="15" y2="1" stroke="currentColor"/></svg>`}

function setTheme(t,msg){const r=document.documentElement;r.classList.add("theme-anim");if(t)r.dataset.theme=t;else delete r.dataset.theme;

/* ---------- estado ---------- */
const fresh=()=>({v:1,answers:{},status:{},seen:{},startedAt:null,updatedAt:0,submittedAt:null,last:null,genOK:false});

 return writing}

/* ---------- planilha da Garowa ---------- */
function newRid(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function sheetBody(kind){const A=S.answers;const respostas={};QS.forEach(q=>{respostas["P"+p2(q.n)]=fmtQ(q.n,A)||""});const sum=summaryText(A,S);
 return {key:SHEET_KEY,kind,rid:S.rid,teste:TESTE,progress:countDone(A),total:TOTAL,startedAt:S.startedAt||null,updatedAt:S.updatedAt||null,
  perguntas:QS.map(q=>`P${p2(q.n)} · ${q.t}`),respostas,resumo:kind==="final"?sum:"",codigo:(sum.match(/AAQ1\.[A-Za-z0-9+/=]+/)||[""])[0]}}
/* texto simples não dispara a checagem prévia de CORS; o Apps Script responde por redirecionamento, que o fetch segue */
function postSheet(body,beacon){const data=JSON.stringify(body);
 if(beacon&&navigator.sendBeacon){try{if(navigator.sendBeacon(SHEET_URL,new Blob([data],{type:"text/plain;charset=utf-8"})))return Promise.resolve({ok:true})}catch(e){}}
 const ctl=typeof AbortController==="function"?new AbortController():null;const to=setTimeout(()=>ctl&&ctl.abort(),25000);
 return fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:data,signal:ctl?ctl.signal:undefined,keepalive:!!beacon&&data.length<60000})
  .then(r=>r.json()).then(j=>{clearTimeout(to);if(!j||j.ok!==true)throw 0;return j},e=>{clearTimeout(to);throw e})}

 postSheet(sheetBody("rascunho")).then(()=>{draftFails=0;S.syncedAt=Math.max(S.syncedAt||0,at);saveLocal();if(!draftDirty)setSave("Salvo com a Garowa")},()=>{draftFails++;draftDirty=true;setSave("Salvo neste navegador")})

const getV=(n,p,A=S.answers)=>A?.[n]?.[p];
function setV(n,p,v){S.answers[n]=S.answers[n]||{};S.answers[n][p]=v;touch()}
function visible(q,i,A){const p=q.parts[i];if(!p.showIf)return true;const v=getV(q.n,p.showIf[0],A);return v&&v.c===p.showIf[1]}
function multiSel(v){return (v?.sel||[]).filter(s=>s!=="o"||(v.o||"").trim())}
function rankItems(p,A,n,i){return p.outro?p.items.concat([((A?.[n]?.["o"+i])||"").trim()||p.outro]):p.items}
function partAnswered(p,v){if(v==null)return false;switch(p.type){
 case"text":return !!String(v).trim();
 case"single":return v.c!=null&&(v.c!=="o"||!!(v.o||"").trim());
 case"multi":case"palette":return multiSel(v).length>0;
 case"rank":return v.length>0;
 case"scales":return v.some(Boolean);
 case"matrix":return Object.keys(v).length>0;
 case"duel":return !!v.x||(v.p||[]).some(Boolean);
 case"age":return !!v.touched;
 case"money":return +v>0;
 case"words":return (v.is||[]).length+(v.never||[]).length>0||!!(v.isO||"").trim()||!!(v.neverO||"").trim();
 case"gen":return (p.mode==="multi"?(v.sel||[]).filter(s=>s!=="o"||(v.o||"").trim()).length>0:(v.c!=null&&v.c!=="own")||!!(v.rewrite||"").trim())}
 return false}
function answered(n,A=S.answers){const q=QM[n];return q.parts.some((p,i)=>visible(q,i,A)&&partAnswered(p,getV(n,i,A)))}
function countDone(A){return QS.filter(q=>answered(q.n,A)).length}

/* ---------- navegação ---------- */
const firstOf=b=>QS.find(q=>q.b===b).n;
const lastOf=b=>QS.filter(q=>q.b===b).slice(-1)[0].n;
function markLeave(){if(SCR.t==="q"){const n=SCR.n;S.status[n]=answered(n)?"respondida":"pulada";saveLocal()}}
function go(scr,dir=1){markLeave();SCR=scr;DIR=dir;ANIM=true;UI.idx=false;UI.restart=false;
 if(scr.t==="q"){S.seen[scr.n]=true;S.last=scr.n;if(!S.startedAt&&!NOSAVE){S.startedAt=Date.now()}saveLocal();
  const q=QM[scr.n];const gp=q.parts[0];
  if(gp.type==="gen"&&!(getV(scr.n,0)?.opts||[]).length&&!GEN[scr.n]){const nn=scr.n;if(S.genOK&&SAMPLE)setTimeout(()=>genStart(nn,false),0);else if(INIT&&!SAMPLE)setTimeout(()=>useFallback(nn),0)}}
 render();window.scrollTo(0,0)}
function next(){const n=SCR.n;markLeave();
 if(UI.fromReview){UI.fromReview=false;return go({t:"review"})}
 if(n===TOTAL)return go({t:"review"});
 const q=QM[n];if(n===lastOf(q.b))return go({t:"cover",b:q.b+1});go({t:"q",n:n+1})}
function back(){if(SCR.t==="q"){const q=QM[SCR.n];if(SCR.n===firstOf(q.b))return go({t:"cover",b:q.b},-1);return go({t:"q",n:SCR.n-1},-1)}
 if(SCR.t==="cover"){if(SCR.b===1)return go({t:"intro"},-1);return go({t:"q",n:lastOf(SCR.b-1)},-1)}
 if(SCR.t==="review")return go({t:"q",n:S.last||TOTAL},-1)}
function resumeTarget(){if(S.last&&QM[S.last])return S.last;const after=QS.find(q=>q.n>(S.last||0)&&!S.seen[q.n]);if(after)return after.n;const any=QS.find(q=>!S.seen[q.n]);return any?any.n:null}

/* ---------- formatação legível ---------- */
function optLabel(p,i,v){if(i==="o")return (v?.o||"").trim();return p.opts[i]?.t??""}
function scaleRead(ax,pos){if(!pos)return"";if(ax.reads)return ax.reads[pos-1];const l=ax.l.toLowerCase(),r=ax.r.toLowerCase();return ["Totalmente "+l,"Mais "+l,"No meio","Mais "+r,"Totalmente "+r][pos-1]}
function moneyFmt(d){return (d||"").replace(/\D/g,"").replace(/\B(?=(\d{3})+(?!\d))/g,".")}
function fmtPart(p,v,ctx={}){switch(p.type){
 case"text":return String(v).trim();
 case"single":return optLabel(p,v.c,v);
 case"multi":{const s=multiSel(v).map(i=>optLabel(p,i,v));let t=s.join("; ");if(p.principal&&v.main!=null)t+="\nPrincipal: "+optLabel(p,v.main,v);return t}
 case"palette":return multiSel(v).map(i=>p.opts[i].t).join("; ");
 case"rank":{const it=rankItems(p,ctx.A,ctx.n,ctx.i);const hasO=p.outro&&((ctx.A?.[ctx.n]?.["o"+ctx.i])||"").trim();const rest=it.map((_,i)=>i).filter(i=>!v.includes(i)&&(!p.outro||i<p.items.length||hasO));let t=v.map((i,k)=>`${k+1}. ${it[i]}`).join("  ");if(rest.length)t+="\nSem posição: "+rest.map(i=>it[i]).join("; ");return t}
 case"scales":return p.axes.map((ax,i)=>v[i]?`${ax.l} ↔ ${ax.r}: ${scaleRead(ax,v[i]).toLowerCase()} (${v[i]} de 5)`:null).filter(Boolean).join("\n");
 case"matrix":return p.rows.map((r,i)=>v[i]!=null?`${r}: ${p.cols[v[i]].toLowerCase()}`:null).filter(Boolean).join("; ");
 case"duel":if(v.x)return p.exclusive;return p.pairs.map((pr,i)=>v.p?.[i]?(p.quote?`Par ${i+1}: legenda ${v.p[i].toUpperCase()} (“${pr[v.p[i]==="a"?0:1]}”)`:`${pr[0]} ou ${pr[1]}: ${pr[v.p[i]==="a"?0:1]}`):null).filter(Boolean).join("\n");
 case"age":return `Entre ${v.a} e ${v.b} anos`;
 case"money":return "R$ "+moneyFmt(v);
 case"words":{const vo=p.vocab;const is=(v.is||[]).map(i=>vo[i]).concat((v.isO||"").trim()?[v.isO.trim()]:[]);const nv=(v.never||[]).map(i=>vo[i]).concat((v.neverO||"").trim()?[v.neverO.trim()]:[]);return [is.length?"A marca é: "+is.join(", "):"",nv.length?"A marca nunca é: "+nv.join(", "):""].filter(Boolean).join("\n")}
 case"gen":{if(p.mode==="multi"){const s=(v.sel||[]).filter(x=>x!=="o").concat((v.sel||[]).includes("o")&&(v.o||"").trim()?[v.o.trim()]:[]);return s.join("; ")}
  const r=(v.rewrite||"").trim();return r||(v.c&&v.c!=="own"?v.c:"")}}
 return""}
function fmtQ(n,A=S.answers){const q=QM[n];const out=[];q.parts.forEach((p,i)=>{if(!visible(q,i,A))return;const v=getV(n,i,A);if(!partAnswered(p,v))return;const t=fmtPart(p,v,{A,n,i});if(t)out.push((q.parts.length>1&&p.label?p.label+": ":"")+t)});return out.join("\n")}
function summaryText(A,meta){const lines=["Again & Again · Questionário de marca · Garowa",`Preenchido em ${fmtDate(meta.updatedAt||Date.now())} · ${countDone(A)} de ${TOTAL} respondidas`,""];
 BLOCKS.forEach(b=>{lines.push(`${p2(b.n)} ${b.t.toUpperCase()}`,"");QS.filter(q=>q.b===b.n).forEach(q=>{lines.push(`P${q.n}. ${q.t}`,fmtQ(q.n,A)||"Sem resposta","")})});
 lines.push("Make it rain. · Garowa","");
 try{const code=btoa(unescape(encodeURIComponent(JSON.stringify({answers:A,status:meta.status||{},startedAt:meta.startedAt||null,updatedAt:meta.updatedAt||Date.now()}))));lines.push("Código para a Garowa (não apague esta linha):","AAQ1."+code)}catch(e){}
 return lines.join("\n")}

/* ---------- componentes ---------- */
const pid=(n,p,x)=>`c-${n}-${p}-${x}`;
function lbl(p,right=""){return p.label||right?`<div class="plabel"><span class="mono">${esc(p.label||"")}</span>${right?`<span class="mono lim">${right}</span>`:""}</div>`:""}
function rText(q,i,p){const v=getV(q.n,i)||"";const max=p.max||3000;const id=pid(q.n,i,"t");
 const fld=p.size==="short"?`<input class="field" id="${id}" data-in="text" data-n="${q.n}" data-p="${i}" maxlength="${max}" placeholder="${esc(p.ph)}" value="${esc(v)}" autocomplete="off">`
  :`<textarea class="field" id="${id}" data-in="text" data-n="${q.n}" data-p="${i}" rows="${p.size==="medium"?3:5}" maxlength="${max}" placeholder="${esc(p.ph)}">${esc(v)}</textarea>`;
 return `${p.label?`<label for="${id}" class="plabel"><span class="mono">${esc(p.label)}</span></label>`:""}${p.prefix?`<div class="prefix">${esc(p.prefix)}</div>`:""}${fld}<div class="fmeta mono" id="${id}-cnt">${counterTxt(v,max)}</div>`}
function counterTxt(v,max){const r=max-v.length;if(v.length>=max)return "Você chegou ao limite deste campo.";return v.length>=max*.8?r+" caracteres":""}
function outroField(q,i,v,ph){return `<div class="outro-in"><input class="field" id="${pid(q.n,i,"o")}" data-in="outro" data-n="${q.n}" data-p="${i}" maxlength="120" placeholder="${esc(ph)}" value="${esc(v?.o||"")}" autocomplete="off" aria-label="${esc(ph)}"></div>`}
function optBtn(q,i,p,k,o,checked,role,act,extra=""){const st=p.style||"cards";const ix=k==="o"?"+":p2(k+1);
 if(st==="chips")return `<button type="button" class="ctl chip ${k==="o"?"outro":""} ${extra}" id="${pid(q.n,i,k)}" role="${role}" aria-checked="${checked}" data-act="${act}" data-n="${q.n}" data-p="${i}" data-k="${k}"><span class="pf">${checked&&role==="checkbox"&&o.ord?o.ord:(k==="o"?"+":"")}</span>${esc(o.t)}${o.tag?` <span class="tag">${o.tag}</span>`:""}</button>`;
 return `<button type="button" class="ctl card ${extra}" id="${pid(q.n,i,k)}" role="${role}" aria-checked="${checked}" data-act="${act}" data-n="${q.n}" data-p="${i}" data-k="${k}"><span class="ix">${ix}</span><span class="tx">${esc(o.t)}${o.s?`<span class="sub">${esc(o.s)}</span>`:""}</span><span class="box" aria-hidden="true"></span></button>`}
function wrapOpts(p,inner,label){const st=p.style||"cards";return st==="chips"?`<div class="chips" role="${label.role}" aria-label="${esc(label.t)}">${inner}</div>`:`<div class="cards ${st==="list"?"list":""}" role="${label.role}" aria-label="${esc(label.t)}">${inner}</div>`}
function rSingle(q,i,p){const v=getV(q.n,i)||{};let h=p.opts.map((o,k)=>optBtn(q,i,p,k,o,v.c===k,"radio","single")).join("");
 if(p.outro)h+=optBtn(q,i,p,"o",{t:p.outro},v.c==="o","radio","single");
 return lbl(p)+wrapOpts(p,h,{role:"radiogroup",t:p.label||q.t})+(p.outro&&v.c==="o"?outroField(q,i,v,p.outroPh):"")}
function rMulti(q,i,p){const v=getV(q.n,i)||{sel:[]};const sel=v.sel||[];const full=p.limit&&sel.length>=p.limit;
 let h=p.opts.map((o,k)=>{const on=sel.includes(k);return optBtn(q,i,p,k,{t:o.t,s:o.s,ord:on?sel.indexOf(k)+1:"",tag:p.principal&&v.main===k?"PRINCIPAL":""},on,"checkbox","multi",!on&&full?"dim":"")}).join("");
 if(p.outro){const on=sel.includes("o");h+=optBtn(q,i,p,"o",{t:p.outro,ord:on?sel.indexOf("o")+1:"",tag:p.principal&&v.main==="o"?"PRINCIPAL":""},on,"checkbox","multi",!on&&full?"dim":"")}
 let extra=p.outro&&sel.includes("o")?outroField(q,i,v,p.outroPh):"";
 if(p.principal){const ms=multiSel(v);if(ms.length===1)extra+=`<p class="msg">${esc(optLabel(p,ms[0],v))} é o seu canal principal.</p>`;
  else if(ms.length>=2)extra+=`<div class="part"><div class="plabel"><span class="mono">Qual é o principal?</span></div><div class="chips" role="radiogroup" aria-label="Canal principal">${ms.map(k=>`<button type="button" class="ctl chip" id="${pid(q.n,i,"m"+k)}" role="radio" aria-checked="${v.main===k}" data-act="main" data-n="${q.n}" data-p="${i}" data-k="${k}">${esc(optLabel(p,k,v))}</button>`).join("")}</div>${v.mainLost?'<p class="msg">Escolha de novo o canal principal.</p>':""}</div>`}
 return lbl(p,p.limit?`${sel.length} de ${p.limit}`:"")+wrapOpts(p,h,{role:"group",t:p.label||q.t})+extra+`<p class="msg" aria-live="polite" id="lim-${q.n}-${i}">${UI.limitMsg[q.n+"-"+i]||""}</p>`}
function rPalette(q,i,p){const v=getV(q.n,i)||{sel:[]};const sel=v.sel||[];const full=sel.length>=p.limit;const w=[40,25,20,15];
 const h=p.opts.map((o,k)=>{const on=sel.includes(k);return `<button type="button" class="ctl pal ${!on&&full?"dim":""}" id="${pid(q.n,i,k)}" role="checkbox" aria-checked="${on}" data-act="multi" data-n="${q.n}" data-p="${i}" data-k="${k}" aria-label="${esc(o.t)}: ${esc(o.d)}"><span class="sw" aria-hidden="true">${o.c.map((c,j)=>`<span style="background:${c};width:${w[j]}%"></span>`).join("")}</span><span class="hx" aria-hidden="true">${o.c.map((c,j)=>`<span style="width:${w[j]}%">${c}</span>`).join("")}</span><span class="nm"><span>${esc(o.t)}</span><span class="mono">${p2(k+1)}</span></span></button>`}).join("");
 return lbl(p,`${sel.length} de ${p.limit}`)+`<div class="cards" role="group" aria-label="Paletas">${h}</div><p class="msg" aria-live="polite">${UI.limitMsg[q.n+"-"+i]||""}</p>`}
function rRank(q,i,p){const v=getV(q.n,i)||[];const items=rankItems(p,S.answers,q.n,i);const rest=items.map((_,k)=>k).filter(k=>!v.includes(k));
 const row=(k,pos)=>pos?`<div class="rrow on"><button type="button" class="ctl rb" id="${pid(q.n,i,"r"+k)}" data-act="rank-rm" data-n="${q.n}" data-p="${i}" data-k="${k}" aria-label="${esc(items[k])}, posição ${pos}. Ativar para tirar da ordem"><span class="sq">${pos}</span><span id="rk-${q.n}-${i}-${k}">${esc(items[k])}</span></button><button type="button" class="ctl mv" data-act="rank-mv" data-d="-1" data-n="${q.n}" data-p="${i}" data-k="${k}" ${pos===1?"disabled":""} aria-label="Subir ${esc(items[k])} para a posição ${pos-1}">↑</button><button type="button" class="ctl mv" data-act="rank-mv" data-d="1" data-n="${q.n}" data-p="${i}" data-k="${k}" ${pos===v.length?"disabled":""} aria-label="Descer ${esc(items[k])} para a posição ${pos+1}">↓</button></div>`
  :`<div class="rrow"><button type="button" class="ctl rb" id="${pid(q.n,i,"r"+k)}" ${p.outro&&k===p.items.length&&!(getV(q.n,"o"+i)||"").trim()?'disabled title="Escreva a outra prioridade abaixo"':""} data-act="rank-add" data-n="${q.n}" data-p="${i}" data-k="${k}" aria-label="${esc(items[k])}, sem posição. Ativar para colocar na posição ${v.length+1}"><span class="sq"></span><span id="rk-${q.n}-${i}-${k}">${esc(items[k])}</span></button></div>`;
 return `<div class="rank"><p class="msg" style="margin:0 0 16px">Toque de novo num item para tirar da ordem.</p>${v.length?`<div class="grp"><h4 class="mono">Sua ordem</h4>${v.map((k,j)=>row(k,j+1)).join("")}</div>`:""}${rest.length?`<div class="grp"><h4 class="mono">Ainda sem posição</h4>${rest.map(k=>row(k,0)).join("")}</div>`:""}${v.length?`<div class="tools"><button type="button" class="btn-t mono" data-act="rank-reset" data-n="${q.n}" data-p="${i}">Refazer a ordem</button></div>`:""}${p.outro?`<div class="outro-in"><input class="field" id="${pid(q.n,i,"ro")}" data-in="rank-o" data-n="${q.n}" data-p="${i}" maxlength="120" placeholder="${esc(p.outroPh)}" aria-label="${esc(p.outroPh)}" value="${esc(getV(q.n,"o"+i)||"")}" autocomplete="off"></div>`:""}</div>`}
function rScales(q,i,p){const v=getV(q.n,i)||[];const multi=p.axes.length>1;
 return lbl(p)+p.axes.map((ax,a)=>{const cur=v[a]||0;return `<div class="axis"><div class="poles"><span>${multi?`<span class="ai">${"abcde"[a]}</span>`:""}${esc(ax.l)}</span><span>${esc(ax.r)}</span></div><div class="track" role="radiogroup" aria-label="${esc(ax.l)} ou ${esc(ax.r)}">${[1,2,3,4,5].map(k=>`<button type="button" class="pt" id="${pid(q.n,i,"a"+a+"-"+k)}" role="radio" aria-checked="${cur===k}" aria-label="${esc(scaleRead(ax,k))}" data-act="scale" data-n="${q.n}" data-p="${i}" data-a="${a}" data-k="${k}"></button>`).join("")}</div><div class="nums" aria-hidden="true">${[1,2,3,4,5].map(k=>`<span class="${cur===k?"on":""}">${k}</span>`).join("")}</div><div class="read">${esc(scaleRead(ax,cur))}</div></div>`}).join("")}
function rMatrix(q,i,p){const v=getV(q.n,i)||{};const k=Object.keys(v).length;
 return lbl(p)+`<div class="mx"><div class="top mono">${k} de ${p.rows.length} marcados</div>${p.rows.map((r,ri)=>`<div class="row ${v[ri]!=null?"done":""}"><span class="rl"><span class="ri">${p2(ri+1)}</span>${esc(r)}</span><span class="seg" role="radiogroup" aria-label="${esc(r)}">${p.cols.map((c,ci)=>`<button type="button" class="ctl" id="${pid(q.n,i,"m"+ri+"-"+ci)}" role="radio" aria-checked="${v[ri]===ci}" data-act="matrix" data-n="${q.n}" data-p="${i}" data-r="${ri}" data-k="${ci}">${esc(c)}</button>`).join("")}</span></div>`).join("")}</div>`}
function rDuel(q,i,p){const v=getV(q.n,i)||{p:[]};const n=p.pairs.length;
 let h="";if(p.exclusive)h+=`<div class="excl"><button type="button" class="ctl chip" id="${pid(q.n,i,"x")}" role="checkbox" aria-checked="${!!v.x}" data-act="duel-x" data-n="${q.n}" data-p="${i}">${esc(p.exclusive)}</button>${v.x?`<p class="excl-note">Os pares ficaram de lado porque você escolheu “${esc(p.exclusive.toLowerCase())}”.</p>`:""}</div>`;
 h+=p.pairs.map((pr,k)=>{const c=v.p?.[k];const o=(ab,t)=>`<button type="button" class="ctl opt" id="${pid(q.n,i,"d"+k+ab)}" role="radio" aria-checked="${c===ab}" data-act="duel" data-n="${q.n}" data-p="${i}" data-k="${k}" data-v="${ab}" ${v.x?"disabled":""}>${p.quote?`<span class="qm" aria-hidden="true">“</span>`:`<span class="ab">${ab.toUpperCase()}</span>`}<span class="tx">${esc(t)}</span>${p.quote?`<span class="ab">${ab.toUpperCase()}</span>`:""}</button>`;
  return `<div class="duel ${p.quote?"quote":""} ${p.compact?"compact":""}" id="pair-${q.n}-${k}">${n>1?`<div class="dh mono">Par ${k+1} / ${n}</div>`:""}<div class="pair" role="radiogroup" aria-label="${n>1?"Par "+(k+1):esc(q.t)}">${o("a",pr[0])}<span class="or mono" aria-hidden="true">${matchMedia("(max-width:720px)").matches?"ou":"/"}</span>${o("b",pr[1])}</div></div>`}).join("");
 return lbl(p)+h}
function rAge(q,i,p){const v=getV(q.n,i)||{a:30,b:50,touched:false};
 const sl=(w,lab,val)=>`<div class="sl"><label class="mono" for="${pid(q.n,i,"age"+w)}">${lab}</label><input type="range" id="${pid(q.n,i,"age"+w)}" min="18" max="75" step="1" value="${val}" data-in="age" data-w="${w}" data-n="${q.n}" data-p="${i}" aria-valuetext="${val} anos"><button type="button" class="pm" data-act="age" data-w="${w}" data-d="-1" data-n="${q.n}" data-p="${i}" aria-label="${lab}: menos um ano">−</button><button type="button" class="pm" data-act="age" data-w="${w}" data-d="1" data-n="${q.n}" data-p="${i}" aria-label="${lab}: mais um ano">+</button></div>`;
 return lbl(p)+`<div class="age ${v.touched?"":"untouched"}"><div class="read" id="age-read-${q.n}">${v.touched?`Entre ${v.a} e ${v.b}<span class="u">anos</span>`:`${v.a} – ${v.b}<span class="u">toque para ajustar</span>`}</div>${sl("a","Idade mínima",v.a)}${sl("b","Idade máxima",v.b)}${v.touched?`<button type="button" class="btn-t mono" data-act="age-clear" data-n="${q.n}" data-p="${i}">Limpar idade</button>`:""}</div>`}
function rMoney(q,i,p){const v=getV(q.n,i)||"";const id=pid(q.n,i,"$");return `<label for="${id}" class="plabel"><span class="mono">${esc(p.label)}</span></label><div class="money"><span class="cur">R$</span><input id="${id}" inputmode="numeric" autocomplete="off" data-in="money" data-n="${q.n}" data-p="${i}" value="${moneyFmt(v)}" placeholder="0" maxlength="11"><span class="suf mono">${esc(p.suf)}</span></div><p class="msg" id="${id}-msg"></p>`}
function rWords(q,i,p){const v=getV(q.n,i)||{is:[],never:[],isO:"",neverO:""};
 const grp=(g,title,other)=>{const sel=v[g]||[];const oth=v[other]||[];const cnt=sel.length+((v[g+"O"]||"").trim()?1:0);const full=cnt>=3;
  return `<div class="part"><div class="plabel"><span class="mono">${title}</span><span class="mono lim">${cnt} de 3</span></div><div class="chips" role="group" aria-label="${title}">${p.vocab.map((w,k)=>{const on=sel.includes(k);const used=oth.includes(k);return `<button type="button" class="ctl chip ${!on&&(full||used)?"dim":""}" id="${pid(q.n,i,g+k)}" role="checkbox" aria-checked="${on}" data-act="word" data-g="${g}" data-n="${q.n}" data-p="${i}" data-k="${k}" ${used?`title="Já está em “${other==="is"?"A marca é":"A marca nunca é"}”" aria-disabled="true"`:""}><span class="pf">${on?sel.indexOf(k)+1:""}</span>${esc(w)}</button>`}).join("")}</div><div class="outro-in"><input class="field" id="${pid(q.n,i,g+"O")}" data-in="word" data-g="${g}" data-n="${q.n}" data-p="${i}" maxlength="30" placeholder="Outra palavra" aria-label="Outra palavra para ${title}" value="${esc(v[g+"O"]||"")}"></div><p class="msg" aria-live="polite">${UI.limitMsg[q.n+"-"+g]||""}</p></div>`};
 return grp("is","A marca é","never")+grp("never","A marca nunca é","is")}
function rGen(q,i,p){const v=getV(q.n,i);const g=GEN[q.n]||{};
 if(g.st==="loading"&&!g.more){return `<div class="gen-load" aria-busy="true"><div class="lbl mono" aria-live="polite">${q.n===QID.onde?"Pensando em onde ela circula e em quem ela confia":"Reunindo as ideias sobre luxo usado que valem ser derrubadas"} <i>···</i></div><div class="boxes" aria-hidden="true">${"<span></span>".repeat(6)}</div><div class="acts"><button type="button" class="btn-t" data-act="gen-fallback" data-n="${q.n}">Usar as sugestões da Garowa</button></div></div>${p.outro?`<div class="part">${outroField(q,i,v||{},p.outroPh)}</div>`:""}`}
 if(!v||!(v.opts||[]).length){return `<div class="gen-intro"><span class="mono" style="color:var(--ink-2)">Compondo a partir das suas respostas · Q.${p.src}</span><p>Para esta pergunta, montamos sugestões a partir do que você já respondeu. Seu navegador pode pedir permissão uma vez.</p><button type="button" class="btn btn-s" data-act="gen-start" data-n="${q.n}">Ver sugestões <span class="ar">→</span></button></div>`}
 const fresh=g.fresh;let h;
 if(p.mode==="multi"){const sel=v.sel||[];const full=sel.length>=p.limit;

/* Enter avança, salvo em dois casos: num campo de texto longo (Enter quebra linha) e num botão que a pessoa alcançou pelo teclado (Enter aperta o botão).
   Nesses dois casos a dica mostra Ctrl + Enter, que avança de qualquer lugar. Clique e atalho numérico não contam como navegação por teclado. */
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||"")?"⌘":"Ctrl";
let KBNAV=false;
const hintScreen=()=>SCR.t==="q"||SCR.t==="cover"||SCR.t==="review";
function enterAdvances(){const a=document.activeElement;if(!a||a===document.body)return true;if(a.tagName==="TEXTAREA")return false;if(a.id==="primary")return true;if(a.closest&&a.closest("button,a"))return !KBNAV;return true}
const kbdText=()=>enterAdvances()?"Enter ↵":MOD+" + Enter";
function kbdSpan(){return `<span class="kbd mono" id="kbd">${kbdText()}</span>`}
function updKbd(){const k=document.getElementById("kbd");if(k){const t=kbdText();if(k.textContent!==t)k.textContent=t}}
document.addEventListener("pointerdown",()=>{KBNAV=false},true);
document.addEventListener("focusin",()=>updKbd());
document.addEventListener("focusout",()=>setTimeout(updKbd,0));
document.addEventListener("keydown",e=>{const t=e.target;const tag=t.tagName;const typing=tag==="TEXTAREA"||(tag==="INPUT"&&t.type!=="range");
 if(e.key==="Enter"&&(e.isComposing||e.keyCode===229))return;
 if(e.key==="Tab"){KBNAV=true;setTimeout(updKbd,0)}
 if(e.key==="Escape"&&UI.idx){e.preventDefault();A["idx-close"]();return}
 if(UI.idx&&e.key==="Tab"){const f=[...document.querySelectorAll(".drawer button")];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}return}
 if(e.key==="Enter"&&e.repeat&&tag!=="TEXTAREA"){e.preventDefault();return}
 if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();primary();return}
 if(typing){if(e.key==="Enter"&&tag==="INPUT"&&SCR.t==="q"){e.preventDefault();primary()}return}
 if(UI.idx)return;
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const role=t.getAttribute&&t.getAttribute("role");
 if((role==="radio"||role==="checkbox")&&["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"].includes(e.key)){const grp=t.closest('[role="radiogroup"],[role="group"]');if(grp){const items=[...grp.querySelectorAll('[role="radio"],[role="checkbox"]')];const i=items.indexOf(t);const j=(e.key==="ArrowRight"||e.key==="ArrowDown")?Math.min(items.length-1,i+1):Math.max(0,i-1);if(role==="radio"&&grp.classList.contains("track")){e.preventDefault();KBNAV=false;items[j].click();document.getElementById(items[j].id)?.focus()}else{e.preventDefault();KBNAV=true;items[j].focus()}}return}
 if(e.key==="Enter"){if(t.closest("button,a")&&!(hintScreen()&&enterAdvances()))return;e.preventDefault();primary();return}
 if(e.key==="t"||e.key==="T"){toggleTheme();return}
 if((e.key==="i"||e.key==="I")&&(SCR.t==="q"||SCR.t==="review")){UI.idx=true;rerender();return}
 if(/^[1-9]$/.test(e.key)&&SCR.t==="q"){const q=QM[SCR.n];const p=q.parts[0];if(p.type==="single"||p.type==="multi"||p.type==="palette"){const b=document.getElementById(pid(q.n,0,+e.key-1));if(b){KBNAV=false;b.click();document.getElementById(pid(q.n,0,+e.key-1))?.focus();updKbd()}}}
});

 return `Você está ajudando a agência de marketing Garowa a construir o estudo de marca da Again & Again, uma marca brasileira nova de revenda de luxo e premium contemporâneo por consignação, com uma única fundadora.

Respostas da fundadora:

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function cleanList(arr,n,avoid){if(!Array.isArray(arr))return null;const seen=new Set(avoid.map(norm));const out=[];
 for(const x of arr){if(typeof x!=="string")continue;const s=x.trim().replace(/^["“”']+|["“”']+$/g,"").trim();if(!s||s.length>90)continue;const k=norm(s);if(seen.has(k))continue;seen.add(k);out.push(s)}
 const need=n===QID.onde?4:3;const max=n===QID.onde?8:5;return out.length>=need?out.slice(0,max):null}
function useFallback(n){const v=clone(getV(n,0))||{sel:[],c:null,o:"",rewrite:"",more:0};if(!(v.opts||[]).length){v.opts=FALLBACK[QM[n].id].slice();v.origin="reserva";v.sel=v.sel||[];v.more=3;setV(n,0,v)}GEN[n]={st:"idle",fresh:true};if(SCR.t==="q"&&SCR.n===n)rerender()}
function genStart(n,more){if(GEN[n]?.st==="loading")return;if(!SAMPLE){if(!more)useFallback(n);return}
 const cur=clone(getV(n,0))||{opts:[],sel:[],c:null,o:"",rewrite:"",more:0};const ctl=new AbortController();GEN[n]={st:"loading",more,ctl};UI.genMsg[n]="";rerender();
 const keep=more?(QM[n].parts[0].mode==="multi"?cur.opts.filter(o=>cur.sel.includes(o)):cur.opts.filter(o=>o===cur.c)):[];
 SAMPLE.json(genPrompt(n,more?cur.opts:[]),{modelTier:"quick",cache:false,signal:ctl.signal}).then(arr=>{const list=cleanList(arr,n,more?cur.opts:[]);if(!list)throw {code:"invalid"};
  const v=clone(getV(n,0))||cur;const max=n===QID.onde?8:5;v.opts=keep.concat(list).slice(0,Math.max(max,keep.length));v.origin="claude";if(more)v.more=(v.more||0)+1;v.sel=v.sel||[];setV(n,0,v);S.genOK=true;saveLocal();GEN[n]={st:"idle",fresh:true}})
 .catch(e=>{if(e&&e.code==="cancelled"){GEN[n]={st:"idle"};return}if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared"||e.code==="capability_disabled"))SAMPLE=null;
  if(more){GEN[n]={st:"idle"};UI.genMsg[n]="Não conseguimos novas sugestões agora. As atuais continuam aqui."}else{GEN[n]={st:"idle"};useFallback(n)}})
 .finally(()=>{if(SCR.t==="q"&&SCR.n===n)rerender()})}

function fmsg(t){UI.final.msg=t;const el=document.getElementById("fmsg");if(el)el.textContent=t}
function doSend(){if(MODE!=="A"&&AUTO)return sendMail();if(!DB||!UID){UI.final.failed=true;rerender();return}UI.final.sending=true;UI.final.failed=false;rerender();const prev=S.submittedAt;S.submittedAt=Date.now();saveLocal();
 pushRemote().then(()=>{UI.final.sending=false;announce("Respostas enviadas à Garowa");rerender()},()=>{S.submittedAt=prev;saveLocal();UI.final.sending=false;UI.final.failed=true;rerender()})}
function postForm(){const c=countDone(S.answers);
 const body={_subject:`${TESTE?"[TESTE] ":""}Again & Again · respostas do questionário (${c} de ${TOTAL})`,_template:"table",_captcha:"false","Respondidas":`${c} de ${TOTAL}`,"Enviado em":fmtDT(Date.now())};
 QS.forEach(q=>{const t=q.t.length>70?q.t.slice(0,68)+"…":q.t;body[`P${p2(q.n)} · ${t}`]=(fmtQ(q.n)||"Sem resposta").replace(/\n/g," · ")});
 const code=(summaryText(S.answers,S).match(/AAQ1\.[A-Za-z0-9+/=]+/)||[""])[0];body["Código para o painel (não apague)"]=code;
 const ctl=typeof AbortController==="function"?new AbortController():null;const to=setTimeout(()=>ctl&&ctl.abort(),25000);
 return fetch(SEND_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
 .then(r=>r.json().catch(()=>({})).then(j=>{clearTimeout(to);if(!r.ok||j.success===false||j.success==="false")throw 0}),e=>{clearTimeout(to);throw e})}
function deliver(){if(canSheet&&!S.rid){S.rid=newRid();saveLocal()}
 if(TESTE){const a=canSheet?postSheet(sheetBody("final")):Promise.reject(),b=canForm?postForm():Promise.reject();return a.catch(()=>b).then(r=>b.catch(()=>{}).then(()=>r))}
 return (canSheet?postSheet(sheetBody("final")):Promise.reject()).catch(()=>canForm?postForm():Promise.reject())}
function delivered(){S.submittedAt=Date.now();S.pending=false;S.syncedAt=S.updatedAt||0;saveLocal()}
function sendMail(){UI.final.sending=true;UI.final.failed=false;rerender();clearTimeout(draftTimer);
 deliver().then(()=>{delivered();UI.final.sending=false;UI.final.failed=false;announce("Respostas enviadas à Garowa");rerender()},()=>{S.pending=true;saveLocal();UI.final.sending=false;UI.final.failed=true;rerender()})}
/* envio que falhou fica pendente: tenta de novo ao abrir a página e quando a internet volta */
let retrying=false;
function retryPending(){if(!S.pending||!AUTO||NOSAVE||MODE==="A"||retrying)return;retrying=true;
 deliver().then(()=>{delivered();if(SCR.t==="final"){UI.final.failed=false;rerender()}},()=>{}).then(()=>{retrying=false})}
window.addEventListener("online",()=>{retryPending();if(draftOn()&&(draftDirty||(S.updatedAt||0)>(S.syncedAt||0)))scheduleDraft(1000)});
function mailHref(){const c=countDone(S.answers);return `mailto:${CONTATO}?subject=${encodeURIComponent(`Again & Again · respostas do questionário (${c} de ${TOTAL})`)}&body=${encodeURIComponent("Olá, Garowa! Seguem minhas respostas do questionário:\n\n")}`}
function doMailCopy(){copyText(summaryText(S.answers,S),()=>fmsg(`Respostas copiadas. No e-mail que abriu, cole o texto e envie para ${CONTATO}. Se o e-mail não abriu, escreva para esse endereço e cole as respostas.`),()=>{UI.final.showText=true;UI.final.msg=`Selecione o texto abaixo, copie e cole num e-mail para ${CONTATO}.`;rerender();const r=document.getElementById("ro-sum");if(r){r.focus();r.select()}})}
function saveFile(name,data){if(!DL){flash("O download não está disponível aqui. Use o botão de copiar.");return}
 flash("Seu resumo está pronto. Confirme o download na janela que abriu.");
 DL.save({filename:name,data}).then(()=>flash("Download concluído."),e=>flash(e&&e.code==="declined"?"O download não foi concluído. Você pode tentar de novo ou copiar as respostas.":"O download não foi concluído. Você pode tentar de novo ou copiar as respostas."))}
function flash(t){if(SCR.t==="final")return fmsg(t);PANEL.msg=t;const el=document.getElementById("pmsg");if(el)el.textContent=t;else announce(t)}
function doDownload(){saveFile("again-again-respostas.txt",summaryText(S.answers,S))}
function copyText(t,ok,fail){try{navigator.clipboard.writeText(t).then(ok,fail)}catch(e){fail()}}
function doCopy(){copyText(summaryText(S.answers,S),()=>{fmsg("Respostas copiadas. Agora é só colar no e-mail ou no WhatsApp para a Garowa.")},()=>{UI.final.showText=true;UI.final.msg="Não conseguimos copiar automaticamente. Selecione o texto abaixo e copie.";rerender();const r=document.getElementById("ro-sum");if(r){r.focus();r.select()}})}

/* ---------- painel Garowa ---------- */
const PANEL={list:null,err:false,imported:[],reports:{},gen:{},names:{},importOpen:false,importErr:"",msg:"",confirm:null,savedS:null};
function entry(id){return (PANEL.list||[]).find(x=>x.id===id)||PANEL.imported.find(x=>x.id===id)}
function startPanel(){if(!DB){PANEL.list=[];if(SCR.t==="panel")rerender();return}
 DB.collection("respostas").onSnapshot(s=>{PANEL.list=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));PANEL.err=false;loadNames();if(SCR.t==="panel"||SCR.t==="pview")rerender()},()=>{PANEL.err=true;if(SCR.t==="panel")rerender()});
 DB.collection("relatorios").onSnapshot(s=>{s.docs.forEach(d=>{PANEL.reports[d.id]=d.data()});if(SCR.t==="pview")rerender()},()=>{})}
async function loadNames(){if(!USER||!PANEL.list)return;try{const ps=await USER.profiles(PANEL.list.map(x=>x.id));let ch=false;for(const id in ps){const nm=ps[id].name||"";if(PANEL.names[id]!==nm){PANEL.names[id]=nm;ch=true}}if(ch&&(SCR.t==="panel"||SCR.t==="pview"))rerender()}catch(e){}}
const nameOf=e=>e.nome||(e.imported?"Resumo importado":(PANEL.names[e.id]||"Respondente sem nome"));
function ago(t){if(!t)return"";const d=(Date.now()-t)/6e4;if(d<1)return"agora";if(d<60)return `há ${Math.round(d)} min`;if(d<1440)return `há ${Math.round(d/60)} h`;if(d<2880)return"ontem";return fmtDT(t)}
function sPanel(){const L=PANEL.list;let body;
 if(L===null)body=`<p class="lead mono">Buscando respostas…</p>`;
 else if(PANEL.err)body=`<div class="notice"><span>Não conseguimos carregar as respostas agora. Atualize a página em instantes.</span></div>`;
 else{const all=PANEL.imported.concat(L);body=all.length?`<div class="pn-list">${all.map(e=>{const c=countDone(e.answers||{});return `<div class="pn-item"><div><p class="nm">${esc(nameOf(e))}</p><div class="meta mono"><span>${c} de ${TOTAL}</span>${e.imported?`<span class="pill">Importado${e.importedAt?" em "+fmtDate(e.importedAt):""}</span>`:`<span class="pill ${e.submittedAt?"done":""}">${e.submittedAt?"Concluído":"Em andamento"}</span>`}${e.startedAt?`<span>Começou em ${fmtDate(e.startedAt)}</span>`:""}<span>Atualizado ${ago(e.updatedAt)}</span></div><div class="bar"><i style="width:${(c/TOTAL*100).toFixed(1)}%"></i></div></div><div class="acts"><button type="button" class="btn btn-p" data-act="p-view" data-id="${e.id}">Ver respostas</button><button type="button" class="btn btn-s" data-act="p-copy" data-id="${e.id}">Copiar</button></div></div>`}).join("")}</div>`
  :`<div class="notice" style="flex-direction:column;align-items:flex-start"><strong style="color:var(--ink)">Nenhuma resposta por aqui ainda.</strong><span>Assim que a fundadora abrir o link e começar, o progresso aparece nesta lista.</span></div>`}
 return header({label:"Painel Garowa"})+`<main class="frame page pad-foot ${ANIM?"enter":""}"><span class="eyebrow mono">Painel Garowa · só você vê esta tela</span><h1 tabindex="-1">Respostas · Again & Again</h1><p class="lead">Quem responde pelo link do claude.ai aparece aqui sozinho, em tempo real. Quem responde pelo arquivo ou por um link externo envia as respostas por e-mail: cole o e-mail inteiro em “Importar resumo” e ele fica guardado aqui, como os outros.</p>
 <div class="toolbar"><button type="button" class="btn btn-s" data-act="p-copylink">Copiar link do questionário</button><button type="button" class="btn btn-s" data-act="p-preview">Ver o questionário como a cliente</button><button type="button" class="btn btn-s" data-act="p-import" aria-expanded="${PANEL.importOpen}">Importar resumo</button></div><p class="msg" id="pmsg" role="status">${esc(PANEL.msg)}</p>
 ${PANEL.importOpen?`<div class="imp"><label for="imp-n" class="mono">Nome da respondente (opcional)</label><input id="imp-n" class="field" style="max-width:420px" placeholder="Ex.: fundadora da Again & Again"><label for="imp-t" class="mono">Cole aqui o resumo inteiro que chegou por e-mail, WhatsApp ou cópia.</label><textarea id="imp-t"></textarea>${PANEL.importErr?`<p class="msg">${esc(PANEL.importErr)}</p>`:""}<div><button type="button" class="btn btn-p" data-act="p-import-go">Ler resumo</button></div></div>`:""}${body}</main>`}
const REQ=["Síntese em 5 linhas","A fundadora e o que move a marca","O negócio e as prioridades","Quem compra","Quem deixa peças","Território de posicionamento","Personalidade e tom de voz","Identidade visual e campanhas","Canais e conteúdo","Estrutura: Garowa e fundadora","Lançamento","Investimento e expectativas","Tensões e contradições","Lacunas e perguntas para a reunião","Próximos 90 dias"];
function reportHeader(id,rep){const e=entry(id)||{};const A=e.answers||{};const pul=QS.filter(q=>!answered(q.n,A)).map(q=>"P"+q.n);const c=TOTAL-pul.length;const g=n=>{const v=A[n]?.[0];return v?.origin==="claude"?"Claude":v?.origin==="reserva"?"reserva":"não gerada"};
 return `# Again & Again · Leitura do questionário\nCliente: ${nameOf(e)} · Again & Again\nRespondido em: ${fmtDate(e.updatedAt)} · Leitura gerada em: ${fmtDT(rep.at)}\nProgresso: ${c} de ${TOTAL} respondidas · Puladas: ${pul.length?pul.join(", "):"nenhuma"}\nOpções ao vivo: P${QID.onde} ${g(QID.onde)} · P${QID.derrubar} ${g(QID.derrubar)}\nUso interno Garowa. Não compartilhar com a cliente.${c<=35?`\nLeitura parcial: ${TOTAL-c} perguntas sem resposta.`:""}`}
function reportDoc(id){const rep=PANEL.reports[id];return rep?reportHeader(id,rep)+"\n\n"+rep.md:""}
function repVal(q,p,v,A,i){switch(p.type){
 case"text":return String(v).trim();
 case"single":return optLabel(p,v.c,v);
 case"multi":{const s=multiSel(v).map(i=>optLabel(p,i,v));return p.principal?{canais:s,principal:v.main!=null?optLabel(p,v.main,v):null}:s}
 case"palette":return multiSel(v).map(i=>({nome:p.opts[i].t,descricao:p.opts[i].d}));
 case"rank":{const it=rankItems(p,A,q.n,i);return {ordem:v.map(k=>it[k]),nao_ordenados:it.filter((_,k)=>!v.includes(k)&&(!p.outro||k<p.items.length))}}
 case"scales":{const a=p.axes.map((ax,i)=>({polo_esquerdo:ax.l,polo_direito:ax.r,posicao:v[i]||null})).filter(x=>x.posicao);return q.n===QID.aparecer||q.n===QID.lancamento?Object.assign(a[0]||{},{de:5}):a}
 case"matrix":return Object.fromEntries(p.rows.map((r,i)=>[r,v[i]!=null?p.cols[v[i]].toLowerCase():"sem resposta"]));
 case"duel":return v.x?{escolha:p.exclusive}:p.pairs.map((pr,i)=>({a:pr[0],b:pr[1],escolha:v.p?.[i]?pr[v.p[i]==="a"?0:1]:null}));
 case"age":return {faixa_idade:`${v.a} a ${v.b} anos`};
 case"money":return "R$ "+moneyFmt(v);
 case"words":{const vo=p.vocab;return {define:(v.is||[]).map(i=>vo[i]).concat((v.isO||"").trim()?[v.isO.trim()]:[]),nunca:(v.never||[]).map(i=>vo[i]).concat((v.neverO||"").trim()?[v.neverO.trim()]:[])}}
 case"gen":return p.mode==="multi"?{origem:v.origin,opcoes_apresentadas:v.opts,escolhidas:(v.sel||[]).filter(x=>x!=="o").concat(v.sel?.includes("o")&&(v.o||"").trim()?[v.o.trim()]:[])}:{origem:v.origin,opcoes_apresentadas:v.opts,escolhidas:v.c&&v.c!=="own"?[v.c]:[],reescrita:(v.rewrite||"").trim()||null}}}
function optsOf(p){if(p.type==="single"||p.type==="multi")return p.opts.map(o=>o.t);if(p.type==="palette")return p.opts.map(o=>o.t);if(p.type==="rank")return p.items;if(p.type==="matrix")return {itens:p.rows,opcoes:p.cols};if(p.type==="words")return p.vocab;return null}
const TIPO={text:"texto",single:"escolha_unica",multi:"escolha_multipla",palette:"paleta",rank:"ordenacao",scales:"eixos",matrix:"matriz",duel:"este_ou_aquele",words:"palavras",gen:"gerada",age:"composta",money:"composta"};
function reportJSON(e){const A=e.answers||{};const pul=QS.filter(q=>!answered(q.n,A)).map(q=>q.n);
 const respostas=QS.map(q=>{const st=answered(q.n,A)?"respondida":"pulada";const vis=q.parts.map((p,i)=>({p,i})).filter(x=>visible(q,x.i,A));
  const o={n:q.n,bloco:p2(q.b)+" "+BLOCKS[q.b-1].t,titulo:q.t,status:st};
  if(vis.length===1&&q.parts.length===1){const {p,i}=vis[0];const v=A[q.n]?.[i];o.tipo=q.n===QID.aparecer?"escala":TIPO[p.type];const op=optsOf(p);if(op)o.opcoes=op;if(p.limit)o.limite=p.limit;o.valor=partAnswered(p,v)?repVal(q,p,v,A,i):null}
  else{o.tipo="composta";o.valor={};const ops={};vis.forEach(({p,i})=>{const k=p.label||"resposta";const v=A[q.n]?.[i];o.valor[k]=partAnswered(p,v)?repVal(q,p,v,A,i):null;const op=optsOf(p);if(op)ops[k]=op});if(Object.keys(ops).length)o.opcoes=ops;if(st==="pulada")o.valor=null}
  return o});
 return {meta:{marca:"Again & Again",respondente:nameOf(e),iniciado_em:e.startedAt?new Date(e.startedAt).toISOString():null,enviado_em:e.updatedAt?new Date(e.updatedAt).toISOString():null,total_perguntas:TOTAL,respondidas:TOTAL-pul.length,puladas:pul},respostas}}
const REPORT_PROMPT="";
async function genReport(id){const e=entry(id);if(!e)return;PANEL.confirm=null;const c=countDone(e.answers||{});
 if(c<15){PANEL.gen[id]={st:"error",msg:`Respostas insuficientes para uma leitura útil (${c} de ${TOTAL}). Recomendamos completar o questionário ou cobrir os blocos na reunião.`};rerender();return}
 if(!SAMPLE){PANEL.gen[id]={st:"error",msg:"A geração do relatório não está disponível nesta visualização. Abra o painel no claude.ai, com sua conta."};rerender();return}
 const ctl=new AbortController();PANEL.gen[id]={st:"loading",text:"",ctl};rerender();
 const prompt=REPORT_PROMPT.replace("{{RESPOSTAS_JSON}}",JSON.stringify(reportJSON(e),null,1));
 try{const r=await SAMPLE(prompt,{modelTier:"complex",signal:ctl.signal,cache:false,onText:({text})=>{PANEL.gen[id].text=text;const el=document.getElementById("rep-body");if(el)el.innerHTML=md(text)}});
  const ok=REQ.every(h=>r.text.includes("## "+h));const rep={md:r.text,at:Date.now(),basedOn:e.updatedAt||0,count:c,complete:ok&&!r.truncated};PANEL.reports[id]=rep;PANEL.gen[id]={st:"done"};
  if(DB&&!String(id).startsWith("imp-"))DB.doc("relatorios/"+id).set(rep).catch(()=>{})}
 catch(err){PANEL.gen[id]=err&&err.code==="cancelled"?{st:"idle"}:{st:"error",msg:"Não conseguimos gerar o relatório agora. As respostas estão intactas. Tente de novo em instantes.",text:err&&err.text}}
 rerender()}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function md(src){const out=[];let ul=false;const close=()=>{if(ul){out.push("</ul>");ul=false}};
 src.split("\n").forEach(l=>{const t=l.trimEnd();if(/^## /.test(t)){close();out.push(`<h2>${inl(t.slice(3))}</h2>`)}else if(/^# /.test(t)){close();out.push(`<h1>${inl(t.slice(2))}</h1>`)}else if(/^\s*[-*] /.test(t)){if(!ul){out.push("<ul>");ul=true}out.push(`<li>${inl(t.replace(/^\s*[-*] /,""))}</li>`)}else if(!t.trim()){close()}else{close();out.push(`<p>${inl(t)}</p>`)}});close();return out.join("")}
function sPView(){const id=SCR.id;const e=entry(id);if(!e)return header({label:"Painel Garowa"})+`<main class="frame page"><p class="lead">Carregando…</p><button type="button" class="btn-t" data-act="p-back">← Voltar à lista</button></main>`;
 const A=e.answers||{};const c=countDone(A);const g=PANEL.gen[id]||{};const rep=PANEL.reports[id];
 let repH;
 if(g.st==="loading")repH=`<div class="rh"><span class="mono" aria-live="polite">Lendo as respostas e montando o relatório… isso pode levar alguns minutos.</span><button type="button" class="btn btn-s" data-act="p-cancel" data-id="${id}">Cancelar</button></div><div class="md" id="rep-body">${g.text?md(g.text):""}</div>`;
 else if(rep){const stale=(e.updatedAt||0)>(rep.basedOn||0);
  repH=`<div class="rh"><span class="mono">Gerado em ${fmtDT(rep.at)} com ${rep.count} respostas</span><div class="toolbar" style="margin:0"><button type="button" class="btn btn-s" data-act="p-rcopy" data-id="${id}">Copiar relatório</button><button type="button" class="btn btn-s" data-act="p-rdl" data-id="${id}">Baixar</button><button type="button" class="btn btn-s" data-act="p-regen-ask" data-id="${id}">Gerar de novo</button></div></div>
  ${PANEL.confirm===id?`<div class="inline-confirm"><p>O relatório atual será substituído.</p><div class="row"><button type="button" class="btn btn-p" data-act="p-report" data-id="${id}">Gerar de novo</button><button type="button" class="btn btn-s" data-act="p-regen-no">Manter o atual</button></div></div>`:""}
  ${stale?`<div class="notice" style="margin:0 0 20px"><span>As respostas mudaram desde este relatório.</span><button type="button" class="btn-t" data-act="p-report" data-id="${id}">Atualizar relatório</button></div>`:""}
  ${rep.complete===false?`<div class="notice" style="margin:0 0 20px"><span>Relatório incompleto: algumas seções não vieram. Gere de novo para tentar completar.</span></div>`:""}
  <div class="md" id="rep-body"><p class="meta-line">${esc(reportHeader(id,rep)).replace(/\n/g,"<br>")}</p>${md(rep.md)}</div>`}
 else repH=`<div class="rh"><span class="mono">Relatório</span></div><p>Transforme as respostas num primeiro relatório para o estudo de marca: tensões, hipóteses de posicionamento e perguntas para a reunião.</p>${c<24?`<p class="msg">Ainda faltam várias respostas. Dá para gerar agora, mas o relatório vai ficar mais raso.</p>`:""}${g.st==="error"?`<p class="msg">${esc(g.msg)}</p>`:""}<div style="margin-top:16px"><button type="button" class="btn btn-p" data-act="p-report" data-id="${id}">Gerar relatório <span class="ar">→</span></button></div>`;
 if(rep&&g.st==="error")repH=`<p class="msg">${esc(g.msg)}</p>`+repH;
 const ans=BLOCKS.map(b=>`<section class="rv-block"><h3><span class="mono">${p2(b.n)}</span>${esc(b.t)}<span class="mono" style="margin-left:auto">${QS.filter(q=>q.b===b.n&&answered(q.n,A)).length} / ${QS.filter(q=>q.b===b.n).length}</span></h3>${QS.filter(q=>q.b===b.n).map(q=>{const a=fmtQ(q.n,A);return `<div class="rv-item"><span class="n mono">P${q.n}</span><div><p class="t">${esc(q.t)}</p>${a?`<p class="a">${esc(a)}</p>`:`<p class="a none">Sem resposta</p>`}</div><span></span></div>`}).join("")}</section>`).join("");
 return header({label:"Painel Garowa"})+`<main class="frame page pad-foot ${ANIM?"enter":""}"><button type="button" class="btn-t mono" data-act="p-back">← Voltar à lista</button><span class="eyebrow mono" style="display:block;margin-top:20px">${c} de ${TOTAL} respondidas${e.submittedAt?" · Concluído em "+fmtDT(e.submittedAt):e.imported?" · Importado":" · Em andamento"}</span><h1 tabindex="-1">${esc(nameOf(e))}</h1>${!e.submittedAt&&!e.imported?`<p class="lead">Este questionário ainda está em andamento. A lista se atualiza sozinha conforme ela responde.</p>`:""}
 <div class="toolbar"><button type="button" class="btn btn-s" data-act="p-copy" data-id="${id}">Copiar tudo</button><button type="button" class="btn btn-s" data-act="p-dl" data-id="${id}">Baixar respostas</button></div><p class="msg" id="pmsg" role="status">${esc(PANEL.msg)}</p>
 <section class="report" aria-label="Relatório">${repH}</section><div class="ans-block">${ans}</div></main>`}

/* ---------- inicialização ---------- */
async function init(){render();
 const C=window.claude;if(!C||typeof C.use!=="function"){INIT=true;MODE="B";if(SCR.t==="intro")rerender();retryPending();if(!S.pending&&draftOn()&&(S.updatedAt||0)>(S.syncedAt||0))scheduleDraft(1500);return}
 const use=n=>C.use(n).catch(()=>null);
 const [user,db,sample,dl]=await Promise.all([use("user"),use("db"),use("sample"),use("downloads")]);
 USER=user;SAMPLE=sample;DL=dl;
 let owner=false;try{owner=user?await user.isOwner():false}catch(e){}
 if(owner){OWNER=true;MODE="owner";DB=db;INIT=true;go({t:"panel"});startPanel();return}
 if(user&&db){try{UID=await user.id()}catch(e){UID=null}
  if(UID){DB=db;MODE="A";
   try{const snap=await db.doc("respostas/"+UID).get();if(snap.exists){const d=snap.data()||{};if((d.updatedAt||0)>(S.updatedAt||0)){S.answers=clone(d.answers)||{};S.status=clone(d.status)||{};S.startedAt=d.startedAt||S.startedAt;S.updatedAt=d.updatedAt;S.submittedAt=d.submittedAt||null;QS.forEach(q=>{if(S.status[q.n])S.seen[q.n]=true});if(!S.last){const ls=QS.filter(q=>S.seen[q.n]).slice(-1)[0];S.last=ls?ls.n:null}saveLocal()}}}catch(e){}}}
 INIT=true;if(SCR.t==="intro"||SCR.t==="final")rerender()}
init();
})();

</script>
